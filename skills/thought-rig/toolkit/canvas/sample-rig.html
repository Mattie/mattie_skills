<!doctype html><html><meta charset="utf-8"><title>Nested layout rig</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#35313d;font:16px 'Segoe UI',sans-serif;padding:35px}header{font-size:13px;color:#77717b}h1{font-size:32px;font-weight:600}button{font:inherit;padding:10px 18px;background:white;border:1px solid #ccc2d5;border-radius:8px;cursor:pointer}button.active{background:#7460da;color:white}.preview{margin:25px 0;background:#243c48;border-radius:15px;height:190px;padding:30px;color:white;display:flex;align-items:center;gap:24px}.art{height:125px;width:100px;flex-shrink:0;border-radius:9px;background:linear-gradient(145deg,#d6b79c,#69766c,#1e3e40)}.preview button{background:#e0d0f4;margin-left:auto}.preview.left button{order:-1;margin-left:0}.preview.below{flex-wrap:wrap;height:230px}.preview.below button{margin:0 0 0 124px}textarea{width:100%;font:inherit;border:1px solid #cfc8d3;border-radius:8px;padding:10px}footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:#777}</style><header>EMBEDDED RIG · independent page, shared feedback</header><h1>Where should the action live?</h1><div id="options"><button data-value="left">Left</button> <button data-value="right" class="active">Right</button> <button data-value="below">Below</button></div><div class="preview" id="preview"><div class="art"></div><div><strong>Preview content</strong><p>Keep this content prominent.</p></div><button>Continue</button></div><textarea id="note" placeholder="What should we change?" rows="2"></textarea><footer><span id="status">Controls stay local to this pane.</span><button id="send">Attach feedback to canvas</button></footer><script>let choice='right';document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{choice=b.dataset.value;document.getElementById('preview').className='preview '+choice;document.querySelectorAll('[data-value]').forEach(a=>a.classList.toggle('active',a===b))});document.getElementById('send').onclick=()=>{parent.postMessage({type:'thought-rig:feedback',note:'Nested rig: action on '+choice+'. '+document.getElementById('note').value},location.origin);document.getElementById('status').textContent='Feedback sent to canvas';};</script></html>
