<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallax image verifier</title>
<meta name="parallax-renderer" content="ownership-overlap-v2">
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color-scheme:dark;background:#16171b;color:#e8e6df}*{box-sizing:border-box}body{margin:0;padding:20px}button,select,input{font:inherit}button,select{background:#292d35;color:inherit;border:1px solid #4a4d56;border-radius:5px;padding:5px 8px}button{cursor:pointer}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}label{display:flex;gap:7px;align-items:center}select{max-width:85vw}.pair{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;max-width:100%}figcaption{margin-bottom:8px}canvas,img{display:block;max-width:100%;height:auto}#status{color:#b8bcc6;font-size:14px}input[type=range]{width:120px}#fallback{display:none}
</style>
<body>
<div class="controls"><label>Image <select id="image"></select></label><label>Repair margin <select id="margin"></select></label><button id="neutral">Neutral</button><button id="play">Play</button></div>
<div class="controls"><label>X <input id="x" type="range" min="-1" max="1" step=".01" value="0"></label><label>Y <input id="y" type="range" min="-1" max="1" step=".01" value="0"></label><label>View <select id="view"><option value="motion">Motion</option><option value="owner">Ownership</option><option value="surface">Repaired surface</option><option value="depth">Surface depth</option><option value="removal">Removal mask</option></select></label><label>Surface <select id="surface"><option value="0">1 · far</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5 · near</option></select></label></div>
<div class="pair"><figure><figcaption>Static · same crop</figcaption><canvas id="baseline"></canvas></figure><figure><figcaption>Depth + infill</figcaption><canvas id="result"></canvas><img id="fallback" alt="Static source image"></figure></div><p id="status" role="status">Loading…</p>
<script>
'use strict';
const PACKS=/*PACK_DATA*/[];
const $=id=>document.getElementById(id), reduce=matchMedia('(prefers-reduced-motion: reduce)');
let gl,program,buffer,U,active=null,token=0,playing=false,ready=false;
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0.,1.);}`;
// Keep visible-source ownership overlapping at band boundaries. Hard ownership
// switches can expose repaired background for a frame inside a moving subject.
const FS=`precision highp float;varying vec2 v;uniform sampler2D source,colors,depths,ownership,removals;uniform vec2 shift,layerSize;uniform float zoom,mode,selected;
vec2 at(vec2 q,float i){q=clamp(q,.5/layerSize,1.-.5/layerSize);return vec2(q.x,(i*(layerSize.y+4.)+2.+q.y*layerSize.y)/(5.*(layerSize.y+4.)));}
vec3 bandColor(float d){if(d<.2)return vec3(.25,.4,.85);if(d<.4)return vec3(.15,.7,.85);if(d<.6)return vec3(.2,.8,.45);if(d<.8)return vec3(.95,.7,.15);return vec3(.95,.3,.45);}
void main(){vec2 u=.5+(v-.5)*zoom;if(mode<.5||(mode<1.5&&dot(shift,shift)==0.)){gl_FragColor=texture2D(source,u);return;}
if(mode>1.5&&mode<2.5){gl_FragColor=vec4(mix(texture2D(source,u).rgb,bandColor(texture2D(ownership,u).r),.55),1.);return;}
if(mode>4.5){float m=texture2D(removals,at(u,selected)).r;gl_FragColor=vec4(mix(texture2D(source,u).rgb,vec3(.95,.3,.45),.65*m),1.);return;}
if(mode>2.5){vec2 a=at(u,selected);vec4 c=texture2D(colors,a);if(mode>3.5){gl_FragColor=vec4(vec3(texture2D(depths,a).r),1.);return;}float checker=mod(floor(v.x*25.)+floor(v.y*20.),2.);gl_FragColor=vec4(c.rgb+(1.-c.a)*mix(vec3(.15),vec3(.3),checker),1.);return;}
vec3 outColor=vec3(0.);float coverage=0.;for(int i=0;i<5;i++){vec2 q=u;for(int j=0;j<8;j++){float d=texture2D(depths,at(q,float(i))).r;q=u-shift*(d-.5);}vec4 c=texture2D(colors,at(q,float(i)));float originalDepth=texture2D(ownership,q).r;float lo=float(i)/5.,hi=float(i+1)/5.;float enter=i==0?1.:smoothstep(lo-.02,lo+.02,originalDepth);float original=i==4?1.:1.-smoothstep(hi+.02,hi+.06,originalDepth);c=mix(c,vec4(texture2D(source,q).rgb,1.),original)*enter;outColor=c.rgb+(1.-c.a)*outColor;coverage=c.a+(1.-c.a)*coverage;}gl_FragColor=vec4(outColor,coverage);}`;
function fail(error){ready=false;playing=false;console.error(error);$('status').textContent='Static fallback · '+error.message;const c=PACKS[+$('image').value||0];if(c){$('fallback').src=c.source;$('fallback').style.display='block';$('result').style.display='none'}$('play').disabled=true}
function shader(kind,source){const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function initialize(){gl=document.createElement('canvas').getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:true});if(!gl)throw Error('WebGL unavailable');program=gl.createProgram();const vs=shader(gl.VERTEX_SHADER,VS),fs=shader(gl.FRAGMENT_SHADER,FS);gl.attachShader(program,vs);gl.attachShader(program,fs);gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);U=Object.fromEntries(['source','colors','depths','ownership','removals','shift','layerSize','zoom','mode','selected'].map(k=>[k,gl.getUniformLocation(program,k)]));['source','colors','depths','ownership','removals'].forEach((k,i)=>gl.uniform1i(U[k],i));gl.canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail(Error('WebGL context lost'))})}
async function texture(src){const image=new Image();image.src=src;await image.decode();const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);for(const k of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR);for(const k of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);return t}
function dispose(textures){if(textures)for(const t of Object.values(textures))gl.deleteTexture(t)}
async function choose(rebuild=true){ready=false;pause();const n=++token,c=PACKS[+$('image').value];if(rebuild){$('margin').replaceChildren(...c.variants.map(v=>new Option(v.margin_source_px+' source px',v.id)));$('margin').value=c.selected}const variant=c.variants.find(v=>v.id===$('margin').value);const textures={};try{for(const [key,url] of Object.entries({source:c.source,depths:c.depths,ownership:c.owner,colors:variant.color,removals:variant.removal})){textures[key]=await texture(url);if(n!==token){dispose(textures);return}}}catch(e){dispose(textures);throw e}dispose(active?.textures);active={c,variant,textures};ready=true;neutral();$('status').textContent=c.name+' · '+c.travel+' px per-axis coefficient'+(c.static?' · static depth':'');$('play').disabled=c.static||reduce.matches}
function render(canvas,isResult){if(!active)return;const {c,textures}=active,w=c.width,h=c.height;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.canvas.width=w;gl.canvas.height=h;gl.viewport(0,0,w,h);['source','colors','depths','ownership','removals'].forEach((k,i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,textures[k])});const x=Math.max(-1,Math.min(1,+$('x').value)),y=Math.max(-1,Math.min(1,+$('y').value));gl.uniform2f(U.shift,c.static?0:x*c.travel/w,c.static?0:y*c.travel/h);gl.uniform2f(U.layerSize,w,h);gl.uniform1f(U.zoom,1-(c.travel+2)/Math.min(w,h));gl.uniform1f(U.mode,isResult?{motion:1,owner:2,surface:3,depth:4,removal:5}[$('view').value]:0);gl.uniform1f(U.selected,+$('surface').value);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);canvas.getContext('2d').drawImage(gl.canvas,0,0);const err=gl.getError();if(err)throw Error('WebGL error '+err)}
function draw(){render($('baseline'),false);render($('result'),true)}
function pause(){playing=false;$('play').textContent='Play'}
function neutral(){pause();$('x').value=$('y').value=0;draw()}
function position(x,y){pause();$('x').value=Math.max(-1,Math.min(1,x));$('y').value=Math.max(-1,Math.min(1,y));draw()}
for(let i=0;i<PACKS.length;i++)$('image').add(new Option(PACKS[i].name,i));
$('image').onchange=()=>choose().catch(fail);$('margin').onchange=()=>choose(false).catch(fail);$('neutral').onclick=neutral;for(const id of ['x','y','view','surface'])$(id).oninput=()=>{pause();draw()};$('play').onclick=()=>{if(reduce.matches||active?.c.static)return;playing=!playing;$('play').textContent=playing?'Pause':'Play'};reduce.addEventListener('change',()=>{neutral();$('play').disabled=reduce.matches||active?.c.static});
for(const id of ['baseline','result']){$(id).onpointermove=e=>{const r=e.currentTarget.getBoundingClientRect();position(2*(e.clientX-r.left)/r.width-1,2*(e.clientY-r.top)/r.height-1)};$(id).onpointerleave=neutral}
let last=0;function tick(t){if(playing&&t-last>35){$('x').value=Math.sin(t/1200);$('y').value=Math.cos(t/1200);try{draw()}catch(e){fail(e)}last=t}requestAnimationFrame(tick)}
// Local checker interface, also useful when adapting this renderer to an app.
window.parallaxVerifier={get ready(){return ready},get playing(){return playing},get pack(){return active?.c},position,neutral,draw,async choose(i,margin){$('image').value=i;await choose();if(margin){$('margin').value=margin;await choose(false)}},pixels(id){const c=$(id);return Array.from(c.getContext('2d').getImageData(0,0,c.width,c.height).data)}};
addEventListener('pagehide',()=>{dispose(active?.textures);if(gl){gl.deleteBuffer(buffer);gl.deleteProgram(program)}});
try{if(!PACKS.length)throw Error('No images');initialize();choose().catch(fail);requestAnimationFrame(tick)}catch(e){fail(e)}
</script></body></html>
