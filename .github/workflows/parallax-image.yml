name: Parallax image

on:
  pull_request:
    paths:
      - "skills/parallax-image/**"
      - "tests/parallax-image/**"
      - ".github/workflows/parallax-image.yml"
  push:
    branches: [main]
    paths:
      - "skills/parallax-image/**"
      - "tests/parallax-image/**"
      - ".github/workflows/parallax-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-free-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install
          -r skills/parallax-image/scripts/requirements.txt
          -r skills/parallax-image/scripts/requirements-check.txt
          pytest
      - name: Install software browser
        run: python -m playwright install --with-deps chromium
      - name: Run model-free checks
        env:
          PARALLAX_RENDER_TESTS: "1"
        run: python -m pytest -q tests/parallax-image
